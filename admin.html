<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Administración | Anguila Sushi
    </title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>


<body>


    <main class="admin">


        <!-- ============================================= -->
        <!-- LOGIN -->
        <!-- ============================================= -->

        <section
            class="login-admin"
            id="login-admin"
        >

            <div class="login-card">

                <img
                    src="img/Logo.png"
                    alt="Anguila Sushi"
                    class="logo-admin"
                >

                <h1>
                    Administración
                </h1>

                <p>
                    Inicia sesión para administrar la tienda.
                </p>


                <label>
                    Correo
                </label>

                <input
                    type="email"
                    id="admin-email"
                    placeholder="Correo del administrador"
                >


                <label>
                    Contraseña
                </label>

                <input
                    type="password"
                    id="admin-password"
                    placeholder="Contraseña"
                >


                <button
                    type="button"
                    id="iniciar-sesion"
                >
                    Iniciar sesión
                </button>


                <p
                    id="mensaje-login"
                    class="mensaje-login"
                ></p>

            </div>

        </section>



        <!-- ============================================= -->
        <!-- PANEL -->
        <!-- ============================================= -->

        <section
            class="panel-admin"
            id="panel-admin"
            style="display:none;"
        >


            <header class="admin-header">

                <div>

                    <span>
                        ANGUILA SUSHI
                    </span>

                    <h1>
                        Panel de administración
                    </h1>

                </div>


                <button
                    type="button"
                    id="cerrar-sesion"
                    class="cerrar-sesion"
                >
                    Cerrar sesión
                </button>

            </header>



            <!-- ========================================= -->
            <!-- ESTADO TIENDA -->
            <!-- ========================================= -->

            <article class="admin-card">

                <div>

                    <span class="admin-etiqueta">
                        ESTADO DE LA TIENDA
                    </span>

                    <h2>
                        Tienda
                    </h2>

                    <p
                        id="estado-tienda-admin"
                        class="estado-admin"
                    >
                        Cargando...
                    </p>

                </div>


                <button
                    type="button"
                    id="cambiar-estado-tienda"
                    class="boton-control"
                >
                    Cargando...
                </button>

            </article>



            <!-- ========================================= -->
            <!-- PROMOCIÓN 2X1 -->
            <!-- ========================================= -->

            <article class="admin-card">

                <div>

                    <span class="admin-etiqueta">
                        PROMOCIONES
                    </span>

                    <h2>
                        Promoción 2x1
                    </h2>

                    <p
                        id="estado-promo-admin"
                        class="estado-admin"
                    >
                        Cargando...
                    </p>

                </div>


                <button
                    type="button"
                    id="cambiar-promo"
                    class="boton-control"
                >
                    Cargando...
                </button>

            </article>


            <p
                id="mensaje-admin"
                class="mensaje-admin"
            ></p>


        </section>


    </main>



    <!-- ============================================= -->
    <!-- SUPABASE -->
    <!-- ============================================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script
        src="supabase-config.js"
    ></script>


    <!-- ============================================= -->
    <!-- ADMIN -->
    <!-- ============================================= -->

    <script
        src="admin.js"
    ></script>


</body>

</html>
